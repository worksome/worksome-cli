# Manual resource grouping overrides for operations that don't follow naming conventions.
resources:
  viewer:
    queries: ["viewer", "profile"]
    mutations: []
  bank-details:
    queries: []
    mutations: ["storeBankDetails"]
  accounts:
    queries: ["accounts"]
    mutations: []

# Operations to exclude from CLI generation (both queries and mutations).
ignore:
  - "__schema"  # GraphQL introspection
  - "__type"    # GraphQL introspection

# Mutations to exclude from CLI generation (queries with the same name are kept).
ignore_mutations:
  - "hire"  # deprecated: use createDraftHire

# Extra names a resource group also answers to. Use this when the API schema
# changes shape and would otherwise break an existing invocation.
aliases:
  # The API gained a `companies` list query, which folded the singular
  # `company` query into the plural group. Keeps `worksome company get <id>`
  # working. Generation fails if a target or alias here goes stale.
  companies: ["company"]

# Fields never to select, keyed by "Type.field".
#
# Introspection does not return applied directives, so schema.graphql carries
# none of the API's field-level authorization. The generator cannot see which
# fields are access controlled and selects them blind. A guarded field that is
# declared non-null takes the whole parent object down with it when the guard
# denies, so the command fails instead of degrading.
#
# Generation fails if an entry here goes stale.
ignore_fields:
  # Guarded on membership of that specific company, and `[EngagementTypeSetup!]!`,
  # so `company get <id>` returned a null company to every non-member.
  - "Company.usedEngagementTypeSetups"

# Fields to select whenever their type appears nested, keyed by "Type.field".
#
# Nested objects carry only the names in safeNestedFields (internal/codegen),
# chosen to be harmless on any type. Some types are useless without a field
# that list cannot admit globally. An object or union field listed here
# expands to its own safe fields, one level deep.
#
# Generation fails if an entry here goes stale or is also in ignore_fields.
nested_fields:
  # Without these a custom field value came back as a bare id: no value, no
  # field it belongs to, nothing to say which job, contract or trusted
  # contact it is set on. Hire and Contract do not expose their values,
  # so customFields → customFieldValues → appliesTo is the only way to read
  # them, and that path needs appliesTo.
  - "CustomFieldValue.displayValue"
  - "CustomFieldValue.customField"
  - "CustomFieldValue.appliesTo"

# Scalar fields that need arguments, made reachable through --fields, keyed by
# "Type.field". The generator never selects a field with a required argument;
# an entry gives it fixed arguments and the name it answers to (`as`). It is
# offered on request only, never in the default output: the arguments pick a
# view the API may refuse some callers, and a refused non-null field nulls its
# whole parent.
#
# Generation fails if an entry names no field, returns an object, leaves out an
# argument the field needs, uses an enum value the enum lacks, takes a name the
# type already has, is also in ignore_fields, or is on a type no list or get
# returns.
field_arguments:
  # A payment request's billedAmount is the worker's pay only. What the company
  # pays for it, before VAT, adds Worksome's fee, the employment cost, any
  # agency fee and expenses; these were not reachable because each field takes
  # the account type to view the amount as.
  "PaymentRequest.netAmount": { as: companyNetAmount, args: "accountType: COMPANY" }
  "PaymentRequest.grossAmount": { as: companyGrossAmount, args: "accountType: COMPANY" }
  "PaymentRequest.serviceAmount": { as: companyServiceAmount, args: "accountType: COMPANY" }

# CLI action names for operations whose derived name collides with another's.
# Generation fails if an entry here goes stale.
command_names:
  endJobs: "end-many"  # `endJob` already owns `jobs end`
