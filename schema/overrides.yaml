# Manual resource grouping overrides for operations that don't follow naming conventions.
resources:
  viewer:
    queries: ["viewer", "profile"]
    mutations: []
  bank-details:
    queries: []
    mutations: ["storeBankDetails"]
  accounts:
    queries: ["accounts"]
    mutations: []

# Operations to exclude from CLI generation (both queries and mutations).
ignore:
  - "__schema"  # GraphQL introspection
  - "__type"    # GraphQL introspection

# Mutations to exclude from CLI generation (queries with the same name are kept).
ignore_mutations:
  - "hire"  # deprecated: use createDraftHire
