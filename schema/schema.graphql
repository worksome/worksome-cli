"""
An invoice.

An invoice gets created when one or more worker payment requests gets approved by a company user.

The invoice defines the amount due and is to be paid to Worksome by the company.
"""
type Invoice {
  "The ID of the invoice."
  id: ID!

  """
  A number referencing the invoice.
  
  This is usually printed on the invoice itself and should be used by booking system and finance departments.
  
  The invoice number is in a human readable format.
  """
  number: String

  """
  A URL of the actual invoice.
  
  This URL will link to a PDF for the invoice. This URL cannot be used for saving in external systems as it might
  change over time or be regenerated. If a permanent URL is needed for the invoice, it should be stored in the clients
  own system.
  """
  pdfUrl: URL!

  "The type of currency."
  currency: Currency!

  "The total amount including taxes etc."
  grossAmount: Float!

  "The total amount due on invoice minus credited amounts including taxes etc."
  grossOpenAmount: Float!

  "The total amount of taxes to be paid."
  taxAmount: Float!

  "The total amount without taxes."
  netAmount: Float!

  """
  The date that the invoice was marked paid by Worksome.
  
  This date might vary from the actual date it was paid, as it takes time for a payment to go through
  and be validated.
  """
  markedPaidAt: Date

  "The date that the invoice should be paid by."
  dueDate: Date!

  "The company that the invoice is for."
  company: Company!

  "The date that the invoice was created."
  date: Date!

  """
  Checks if the invoice is a batched invoice.
  
  A batch invoice aggregates multiple payment requests together in one, summarised invoice over a period of time.
  This reduces the overhead of processing high volumes of payment requests and corresponding invoices.
  """
  isBatched: Boolean!

  "The type of transaction to be used for the invoice."
  transactionType: InvoiceTransactionType!

  "Checks if the invoice has been fully credited."
  isFullyCredited: Boolean!

  "Checks if the invoice is overdue."
  isOverDue: Boolean

  "The credit notes associated with the invoice."
  creditNotes: [Invoice!]!

  "The original invoice credited by this credit note."
  originalInvoice: Invoice

  """
  A paginated list of all the rows on the invoice.
  
  This can be used to gather more information about the invoice than just the overall amount.
  """
  rows(
    "Limits number of fetched items."
    first: Int! = 10

    "The offset from which items are returned."
    page: Int
  ): InvoiceRowPaginator!
}

"The columns that invoices can be ordered by."
enum InvoicesOrderByColumn {
  "The date the invoice was created."
  DATE

  "The due date."
  DUE_DATE

