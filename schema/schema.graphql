"An item in a batch."
union BatchItem = PaymentRequest

"""
A batch of items for processing.

Batches are a way to group multiple items (such as payment requests) together so that you can perform bulk actions on them.
They're mainly intended for operational workflows inside the platform (e.g., approving or processing large sets of items at once).
For most external integrations, batches are not usually needed – you'll likely want to work directly with the individual items instead.
"""
type Batch @key(fields: "id") {
  "The ID of the batch."
  id: ID!

  "The name of the batch."
  name: String!

  "The type of batch."
  type: BatchType!

  "The account that owns the batch."
  account: Account!

  "The number of items in the batch that have the specified statuses."
  itemsCountByStatus(
    "The statuses to count items for."
    status: [BatchItemStatus!]!
  ): Int!

  "The date and time when the batch was created."
  createdAt: DateTime!

  "The date and time when the batch was last updated."
  updatedAt: DateTime!

  "The date and time when the batch was deleted (if soft deleted)."
  deletedAt: DateTime

  "The items in the batch."
  items(
    "Limits number of fetched items."
    first: Int! = 10

    "The offset from which items are returned."
    page: Int
  ): BatchItemPaginator!
}

"The input used for creating batches."
input CreateBatchInput {
  "The account that the batch is for."
  account: ID!

  "The type of batch to create."
  type: BatchType!

  "A list of items to add to the batch."
  items: [ID!]
}

