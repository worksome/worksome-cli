The settings for a custom field.
"""
type CustomFieldSettings {
  """
  Validation rules for the custom field.
  """
  validation: [CustomFieldValidationRules!]!
}
"""
The settings input for custom fields.
"""
input CustomFieldSettingsInput {
  """
  A list of validation rules to be applied when using custom fields.
  """
  validation: [CustomFieldValidationRules!]
}
"""
A custom fields type.
"""
enum CustomFieldType {
  """
  Single Select input field. Used to collect value from single select dropdown.
  """
  SINGLE_SELECT
  """
  Free Text input field. This can be used to receive any text value
  """
  FREE_TEXT
  """
  Multi Select input field. Used to collect values from multi select dropdown.
  """
  MULTI_SELECT
  """
  File Upload input field. Used to attach an uploaded file as the field value.
  """
  FILE_UPLOAD
}
"""
An input representing a custom field value, tailored to the field type.

All input fields are mutually exclusive.
"""
input CustomFieldTypeValueInput {
  """
  The input custom field values representation of the `SINGLE_SELECT` field type.
  """
  singleSelect: SingleSelectCustomFieldValueInput
  """
  The input custom field values representation of the `FREE_TEXT` field type.
  """
  freeText: FreeTextCustomFieldValueInput
  """
  The input custom field values representation of the `MULTI_SELECT` field type.
  """
  multiSelect: MultiSelectCustomFieldValueInput
  """
  The input custom field values representation of the `FILE_UPLOAD` field type.
  """
  fileUpload: FileUploadCustomFieldValueInput
}
"""
Enum of available validation rules applicable to CustomFields
"""
enum CustomFieldValidationRules {
  """
  Indicated that a CustomField is obligated to have a value when applied to a supporting entity
  """
  REQUIRED
  """
  Indicated that a CustomField is not obligated to have a value
  """
  NULLABLE
}
"""
A custom field value.

Those represents the custom fields value filled for an entity supporting custom fields.

e.g:
You've defined a free-text "sector" custom field applying to `Job` entities.
Say you have a job which is in the "IT" sector.
You'd need to create a custom field value with `field_id = <sector field id>`,  and `content = "IT"`.
"""
type CustomFieldValue {
  """
  The ID of the field value.
  """
  id: ID!
  """
  The account that the field value is owned by.
  """
  account: Account!
  """
  The user who created the field value.
  """
  user: User!
  """
  The entity to which the custom field value is applying to.
  """
  appliesTo: SupportsCustomFieldValue!
  """
  The field that the field value is valid for.
  """
  customField: CustomField!
  """
  The field option which was applied for that field to the entity supporting custom fields.
  
  This will be present for a single-select field type.
  """
  customFieldOption: CustomFieldOption
  """
  The content of the custom field value in the case of a custom field not using custom field options.
  
  This will be present for a free-text field type.
  """
  content: String
  """
  A representation of the value for easier display.
  
  This gives a "human" representation of the custom field value no matter the field type.
  
  For example, this will return `content` for a free-text value, will return the custom field option `value` for a single-select value, or the file `name` for a file-upload value.
  """
  displayValue: String
  """
  The uploaded file referenced by the field value.
  
  Present for `FILE_UPLOAD` field-values; null for every other field type.
  """
  file: File
}
"""
An input for a custom field value.
"""
input CustomFieldValueInput {
  """
  The entity that supports custom fields to which the value should be attached.
  """
  appliesTo: ID!
  """
  The representation of the value.
  """
  value: CustomFieldTypeValueInput!
}
"""
The visibility of a custom field — whether it is hidden from the worker or editable by them.
"""
enum CustomFieldVisibility {
  """
  Custom field with this visibility will not be seen by the worker.
  """
  INTERNAL
  """
  Custom field with this visibility will be available to the worker for input.
  """
  WORKER
}
