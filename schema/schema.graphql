"""
An approval flow that defines a review process triggered by specific events on hires.

Approvals are configured by companies to require sign-off before certain actions take effect.
Currently, approval flows can only be applied to **hires**. The supported automatic triggers are:

- `HIRE_CREATED` — require approval when a new hire is created (e.g. rate exceeds a budget threshold).
- `HIRE_CHANGED` — require approval when an existing hire's contract is modified (e.g. rate or end date changes).
- `CLASSIFICATION_CREATED` — require approval when a worker classification (e.g. IR35, US worker classification)
  is completed on a hire.

A trigger of `NONE` means the approval flow will not be automatically evaluated.

Approval flows cannot currently be applied to jobs, payment requests, or other entities.

Each approval has a trigger (the event that starts the flow), one or more rules (conditions
that determine when approval is needed), and approvers (user groups who must review and approve).
When a matching event occurs, an approval request is created and the action is blocked until
all required approvers have acted. The outcome of rejection depends on the trigger: for
`HIRE_CREATED`, the hire is cancelled; for `HIRE_CHANGED`, the pending contract change is
reverted; for `CLASSIFICATION_CREATED`, the classification result is discarded.

Use the `Workflow` type and its mutations (`createWorkflow`, `updateWorkflow`) to manage
approvals as a complete tree structure (root + rules + approvers) in a single operation.
"""
type Approval {
  """
  The ID of the approval flow.
  """
  id: ID!
  """
  The display name of the approval flow.
  """
  name: String!
  """
  The version number. Each update to an approval creates a new version.
  """
  version: Int!
  """
  Whether this approval flow is currently active, inactive, or archived.
  
  Only `ACTIVE` approvals are evaluated when triggering events occur.
  """
  status: ApprovalStatus!
  """
  The event that triggers this approval flow. All triggers currently apply to hires only.
  
  Possible values:
  - `HIRE_CREATED` — evaluated when a new hire is created.
  - `HIRE_CHANGED` — evaluated when a hire's contract terms are modified.
  - `CLASSIFICATION_CREATED` — evaluated when a worker classification completes on a hire.
  
  Approval flows for jobs, payment requests, or other entities are not currently supported.
  """
  trigger: ApprovalTrigger!
  """
  A human-readable description of the approval flow's purpose.
  """
  description: String
  """
  The company that owns this approval flow.
  """
  company: Company!
  """
  The rules that define conditions and approvers for this approval flow.
  
  Each rule specifies conditions (e.g. "rate > 100") and a sequence of approver groups.
  When the trigger fires, the system evaluates rules to determine which approval path applies.
  """
  approvalRules: [ApprovalRule!]!
  """
  The date and time that the approval was created.
  """
  createdAt: DateTime!
  """
  The date and time that the approval was last updated.
  """
  updatedAt: DateTime!
  """
  The ID of the latest version of this approval flow.
  
  Approvals are versioned — when updated, a new version is created. Use this to navigate
  to the most recent version.
  """
  latestVersionId: String!
}
"""
An approval request — a runtime instance created when a triggering event on a hire matches an approval rule.

Approval requests are currently only created for **hires**. The supported triggering events are:
- A hire is created (`HIRE_CREATED`)
- A hire's contract is changed (`HIRE_CHANGED`)
- A worker classification is completed on a hire (`CLASSIFICATION_CREATED`)

Jobs, payment requests, and other entities do not go through approval workflows.

When a trigger fires and an active approval rule's conditions match, the system creates an
`ApprovalApprovable` linking the hire to the matched rule. The outcome of rejection depends
on the trigger: for `HIRE_CREATED`, the hire is cancelled; for `HIRE_CHANGED`, the pending
contract change is reverted; for `CLASSIFICATION_CREATED`, the classification result is discarded.

Each approval request tracks its history of actions through `approvalStates` — showing who
approved, rejected, or requested changes and when.
"""
type ApprovalApprovable {
  """
  The ID of the approval request.
  """
  id: ID!
  """
  The approval flow that generated this request.
  """
  approval: Approval!
  """
  The specific rule whose conditions matched to create this request.
  """
  approvalRule: ApprovalRule!
  """
  The history of actions taken on this request (approvals, rejections, change requests).
  
  States are recorded in chronological order as each approver acts.
  """
  approvalStates: [ApprovalState!]!
  """
  The item that requires approval (e.g. a hire).
  """
  approvable: Approvable
  """
  Whether the authenticated user can take action on this approval request.
  
  Returns `true` when the user is a member of the next approver group in the sequence
  and the request is still pending their review.
  """
  viewerCanAction: Boolean!
}
"""
The columns that the approvables list can be ordered by.
"""
enum ApprovalApprovableOrderByColumn {
  """
  The approvable created at date
  """
  CREATED_AT
}
"""
A paginated list of ApprovalApprovable items.
"""
type ApprovalApprovablePaginator {
  """
  Pagination information about the list of items.
  """
