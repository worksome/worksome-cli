"""
A rule within an approval flow that defines when approval is required and who must approve.

Each rule belongs to an approval and contains two key parts:
1. **Conditions** (`rules`): Variable comparisons that determine whether this rule applies.
   For example, "hourly rate > 100" or "budget >= 50000". Conditions use workflow variables
   (system fields like rate/budget, or custom fields configured on the company).
2. **Approvers**: An ordered sequence of user groups who must review and approve items that
   match this rule's conditions. Approvers are processed in `position` order.

When a triggering event occurs (e.g. a hire is created), the system evaluates each active rule's
conditions against the item. If a rule matches, approval requests are sent to its approvers.
"""
type ApprovalRule {
  """
  The ID of the approval rule.
  """
  id: ID!
  """
  The approval flow that this rule belongs to.
  """
  approval: Approval!
  """
  The custom fields referenced by this rule's conditions.
  
  These are the company-configured fields used as variables in the rule's conditions.
  """
  fields: [CustomField!]!
  """
  The variable conditions that determine when this rule applies.
  
  Each condition compares a workflow variable (e.g. hourly rate, budget, or a custom field)
  against a value using an operator (e.g. greater than, equals). All conditions must be met
  for the rule to trigger.
  """
  rules: [WorkflowVariableRule!]!
  """
  The user groups assigned to review items that match this rule, in approval order.
  """
  approvers: [Approver!]!
  """
  The number of approver groups assigned to this rule.
  """
  approverCount: Int!
  """
  The date that the approval rule was created.
  """
  createdAt: Date!
  """
  The date that the approval rule was updated.
  """
  updatedAt: Date!
}
"""
A paginated list of ApprovalRule items.
"""
type ApprovalRulePaginator {
  """
  Pagination information about the list of items.
  """
  paginatorInfo: PaginatorInfo!
  """
  A list of ApprovalRule items.
  """
  data: [ApprovalRule!]!
}
"""
A recorded action on an approval request — an entry in the approval audit trail.

Each time an approver acts on an approval request (approves, rejects, or requests changes),
an `ApprovalState` is created to record the decision, the user who made it, and any message.
The system also creates states when an approval is automatically cancelled (e.g. the hire
was cancelled or the job was closed).
"""
type ApprovalState {
  """
  The ID of this approval action record.
  """
  id: ID!
  """
  The action that was taken: `REQUESTED`, `APPROVED`, `REJECTED`, `NEEDS_CHANGE`, or `CANCELLED`.
  """
  state: ApprovalApprovableState!
  """
