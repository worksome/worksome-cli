"""
An enum representing the step a JobCandidate is at in the hiring process
"""
enum JobCandidateHiringStep {
  """
  A JobCandidate in the shortlisted (they have been added as a candidate) hiring step
  """
  SHORTLISTED
  """
  A JobCandidate in the invited to apply (the job has been shared with them) hiring step
  """
  INVITED_TO_APPLY
  """
  A JobCandidate in the applied (they have submitted an offer) hiring step
  """
  APPLIED
  """
  A JobCandidate in the (they have a hire for the job) hiring step
  """
  HIRING
  """
  The supplier has uploaded a candidate. No action has been taken by the MSP yet.
  """
  SELECTION_SUBMITTED
  """
  The MSP is reviewing the CV and assessing the candidate against the hard requirements of the request.
  """
  SELECTION_UNDER_REVIEW
  """
  The MSP has shortlisted the candidate with another runner-up.
  """
  SELECTION_SHORTLISTED
  """
  The candidate does not meet the requirements. A reason should be provided (e.g., rate, skills).
  """
  SELECTION_DECLINED_BY_MSP
  """
  The candidate has withdrawn themselves from the process.
  """
  SELECTION_WITHDRAWN
  """
  The MSP has approved the candidate and presented them to the client.
  """
  SELECTION_PRESENTED_TO_CLIENT
  """
  The client has indicated that they want to speak with the candidate.
  """
  INTERVIEW_SELECTED
  """
  The date and time have been confirmed and recorded in the system.
  """
  INTERVIEW_SCHEDULED
  """
  The interview is completed; we are waiting for feedback from the client or candidate.
  """
  INTERVIEW_COMPLETED
  """
  The candidate or supplier has withdrawn themselves from the process.
  """
  INTERVIEW_WITHDRAWN
  """
  The MSP is hesitant or is comparing the candidate with another runner-up.
  """
  INTERVIEW_SHORTLISTED
  """
  The client does not choose this candidate after the interview.
  """
  COMPLETION_REJECTED_BY_CLIENT
  """
  The MSP decides to not accept candidate anymore.
  """
  COMPLETION_DECLINED_BY_MSP
  """
  The candidate/supplier has withdrawn themselves from the process.
  """
  COMPLETION_WITHDRAWN
  """
  The client wants the candidate; the contract proposal is with the supplier.
  """
  COMPLETION_OFFER_EXTENDED
  """
  The supplier/freelancer is to provide all documents and information.
  """
  COMPLETION_CANDIDATE_ONBOARDING
  """
  The MSP's turn to screen all documents and information.
  """
  COMPLETION_BACKGROUND_CHECK
  """
  The contract is signed. Recruitment for this request is closed.
  """
  COMPLETION_HIRED
  """
  Candidates on hold until interviews with other candidates have taken place.
  """
  COMPLETION_ON_HOLD
  """
  Link a candidate to a talent pool across organizations.
  """
  COMPLETION_TALENTPOOL
}
