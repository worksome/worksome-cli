  """
  message: String
  """
  The reason the approval was automatically cancelled, if applicable.
  
  Only present when `state` is `CANCELLED`. For example, the hire may have been cancelled
  or the associated job closed before the approval was completed.
  """
  cancellationReason: ApprovalCancellationReason
  """
  The approver group that this action was taken on behalf of.
  """
  approver: Approver!
  """
  The approval request that this action belongs to.
  """
  approvalApprovable: ApprovalApprovable!
  """
  The date and time that this action was recorded.
  """
  createdAt: DateTime
}
"""
A paginated list of ApprovalState items.
"""
type ApprovalStatePaginator {
  """
  Pagination information about the list of items.
  """
  paginatorInfo: PaginatorInfo!
  """
  A list of ApprovalState items.
  """
  data: [ApprovalState!]!
}
