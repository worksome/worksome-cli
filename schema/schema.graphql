"""
A custom field.
"""
type CustomField {
  """
  The ID of the field.
  """
  id: ID!
  """
  The user that created the field.
  
  The user may have been deleted in which case we return null.
  """
  user: User
  """
  The account that the field is owned by.
  """
  account: Account!
  """
  The title of the field.
  """
  title: String!
  """
  A unique human-readable key for the field, preferably in a slug format with lowercase and hyphens
  to replace spaces. The key is only unique within the same account.
  """
  slug: String
  """
  The description of the field.
  """
  description: String
  """
  The type of the field.
  """
  fieldType: CustomFieldType!
  """
  The type of item that the field applies to.
  """
  appliesTo: TypeSupportingCustomFieldValues!
  """
  The possible options for the field.
  """
  customFieldOptions: [CustomFieldOption!]!
  """
  Additional custom field settings.
  
  For example, validation rules.
  """
  settings: CustomFieldSettings!
  """
  To which people should the custom field be visible to.
  """
  visibility: CustomFieldVisibility!
  """
  The custom field related values which were applied on an entity.
  """
  customFieldValues: [CustomFieldValue!]!
  """
  Whether the field has been applied to an entity supporting custom fields.
  """
  isUsedInFieldValues: Boolean!
  """
  Access to the approval rule field pivot, containing the operator and rule value.
  """
  rule: WorkflowVariableRule
  """
  Whether the field is enabled for approval workflows.
  """
  approval: Boolean!
  """
  Whether the user querying the field can edit it.
  """
  viewerCanUpdate: Boolean!
  """
  Whether the field is owned by the account the viewer is acting as, either directly
  or through an organisation that account belongs to. Inherited organisation fields
  count as the viewer's own; fields shared by another company do not.
  """
  viewerOwnsField: Boolean!
  """
  Whether the field is enabled to be updated by the API only.
  """
  apiOnly: Boolean!
  """
  Whether workers are allowed to provide values for this field.
  When enabled, workers can update field values through the worker API.
  """
  workerInputAllowed: Boolean!
  """
  Whether recruiters (staffing agencies) are allowed to provide values for this field.
  When enabled, recruiters can update field values through the recruiter API.
  """
  recruiterInputAllowed: Boolean!
  """
  Whether values for this field should be surfaced on client invoices.
  """
  showOnInvoice: Boolean!
  """
  Whether this field is shared with client companies.
  When enabled, clients of the supplier that owns this field will see it during job sharing.
  """
  sharedWithClients: Boolean!
  """
  Whether values for this field are visible to staffing agencies this company shares the job with.
  When enabled, agencies with an active share of the job can read this field's value (read-only).
  """
  sharedWithStaffingAgencies: Boolean!
  """
  Whether the user querying the field can edit the field value. Not to be confused with 'viewerCanUpdate'
  which indicates if the user can edit the field itself, not the field value.
  """
  viewerCanManageFieldValues(
    """
    Specify for which account you want to see access rights to manage fields values of a specific field.
    """
    account: ID!
  ): Boolean!
  """
  The date and time that the field was created.
  """
  createdAt: DateTime!
  """
  The date and time that the field was updated.
  """
  updatedAt: DateTime
  """
  The date and time that the field was deleted.
  """
  deletedAt: DateTime
}
