"""
A workflow — an alternative tree-structured view of an approval flow for hires.

A `Workflow` is backed by the same data as an `Approval`, but exposes the structure as a
tree of nodes (rules with their approvers). Use the `workflow`/`workflows` queries to read
the tree structure, and `createWorkflow`/`updateWorkflow` to manage the entire approval
flow as a single operation.

Workflows currently apply only to hires — they cannot be used for jobs, payment requests, or other entities.
See the `Approval` type for supported trigger events.
"""
