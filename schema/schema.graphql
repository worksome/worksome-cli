  """
  Pagination information about the list of items.
  """
  paginatorInfo: PaginatorInfo!
  """
  A list of Workflow items.
  """
  data: [Workflow!]!
}
"""
A variable that can be used in approval rule conditions.

Workflow variables represent the data points available for building conditions in approval rules.
They include system variables (e.g. hourly rate, daily rate, budget) and company-configured custom fields.
Each variable defines which comparison operators it supports.
"""
interface WorkflowVariable {
  """
  The ID for this variable, used when creating rule conditions.
  """
  id: ID!
  """
  The human-readable title of the variable (e.g. "Hourly Rate", "Budget").
  """
  title: String!
  """
  A description of what the variable represents.
  """
  description: String
  """
  The comparison operators that can be used with this variable (e.g. equals, greater than).
  """
  operators: [WorkflowVariableOperator!]!
}
"""
A condition definition specifying a variable, comparison operator, and threshold value.

For example, to create a condition "hourly rate greater than 100", set `id` to the hourly rate
variable identifier, `operator` to `GREATER_THAN`, and `value` to `"100"`.
"""
input WorkflowVariableFieldRuleInput {
  """
  The threshold value to compare against (as a string).
  """
  value: String!
  """
  The comparison operator (e.g. equals, greater than, less than).
  """
  operator: WorkflowVariableOperator!
}
"""
This enum defines operators for use with approval rules.

Should be used as VariableValue WorkflowVariableOperator RuleValue
"""
enum WorkflowVariableOperator {
  """
  Variable value is less than rule value
  """
  LESS
  """
  Variable value is greater than rule value
  """
  GREATER
  """
  Variable value is less than or equals rule value
  """
  LESS_OR_EQUALS
  """
  Variable value is greater than or equals rule value
  """
  GREATER_OR_EQUALS
  """
  Variable value equals rule value
  """
  EQUALS
  """
  Variable value does not equal rule value
  """
  NOT_EQUALS
  """
  Variable value contains rule value
  """
  CONTAINS
  """
  Variable value does not contain rule value
  """
  DOES_NOT_CONTAIN
  """
  Variable value changed
  """
  CHANGED
}
