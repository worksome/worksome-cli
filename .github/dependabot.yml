# Actions are pinned to commit SHAs for supply-chain safety, which means they
# no longer follow tags on their own. Dependabot is what keeps them current:
# without this file, pinning would quietly freeze them forever.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
