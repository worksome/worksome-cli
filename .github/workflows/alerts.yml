name: Alerts

# A failed PR run is already visible on the PR. This exists for the runs
# nobody is watching: the nightly drift sync, main, and releases.
on:
  workflow_run:
    workflows: [CI, Schema drift, Release]
    types: [completed]

permissions: {}

jobs:
  slack:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Post the failure to #worksome-cli-alerts
        env:
          WEBHOOK: ${{ secrets.SLACK_ALERTS_WEBHOOK }}
          # Via the environment, never interpolated into the script: the
          # branch and title carry whatever a commit author typed.
          WORKFLOW: ${{ github.event.workflow_run.name }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRIGGER: ${{ github.event.workflow_run.event }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::error::SLACK_ALERTS_WEBHOOK is unset or empty; the alert cannot be posted."
            exit 1
          fi
          jq -n \
            --arg workflow "$WORKFLOW" \
            --arg branch "$BRANCH" \
            --arg trigger "$TRIGGER" \
            --arg run_url "$RUN_URL" \
            --arg repo "$REPO" \
            '{
              text: "\($workflow) failed on \($repo)",
              blocks: [
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ":red_circle: *<\($run_url)|\($workflow) failed>* on `\($repo)`\n`\($branch)` · \($trigger)"
                  }
                },
                {
                  type: "context",
                  elements: [{
                    type: "mrkdwn",
                    text: "Runbooks: <https://github.com/\($repo)/tree/main/docs/runbooks|docs/runbooks>"
                  }]
                }
              ]
            }' \
          | curl -sS --fail-with-body -X POST \
              -H 'Content-type: application/json' -d @- "$WEBHOOK"
