name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # For the schema drift job: its pushes use GITHUB_TOKEN, which never triggers
  # pull_request, so it dispatches this workflow on the drift branch instead.
  # See the `report` job for how the result reaches the drift PR.
  workflow_dispatch:

# CI only reads the repo. The org default is write, which CI does not need.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; don't leave a token in .git/config for the
          # repository-controlled build and generate steps to pick up.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: Test
        run: go test ./... -race -coverprofile=coverage.out
      - name: Verify generated code
        run: |
          go run ./cmd/generate/
          git diff --exit-code internal/generated/ README.md

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; don't leave a token in .git/config for the
          # repository-controlled build and generate steps to pick up.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Exact, like the action SHA above: v2.11 floated onto v2.11.4, which
          # reported SA5011 against untouched test code and turned main red.
          version: v2.13.2

  # Checks from a workflow_dispatch run are not attached to any PR, so on the
  # schema drift PR `test` and `lint` would not show. A commit status shows on
  # every PR whose head is that commit, whatever triggered the run. It replaces
  # the pending status the drift job set, under the same context.
  report:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report the result as a commit status
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ (needs.test.result == 'success' && needs.lint.result == 'success') && 'success' || 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" -f context='CI (dispatched)' \
            -f description='test and lint' -f target_url="$RUN_URL"
